<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQL Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="outer">
        <div class="header">
            <h1>SQL quiz app</h1>
            <p>Score: <span id="scoreValue">0</span>/<span id="outOfValue">0</span> </p>
        </div>

        <div class="inner">
            <div class="buttons">
                <button id="start">start</button>
                <button id="reset">reset</button>
            </div>
            <div class="question">
            </div>
            <div class="buttons">
                <button id="skip">skip</button>
                <button id="show">show</button>
                <button id="next">next</button>
            </div>
            <div class="answer">
            </div>
        </div>
    </div>

    <script src="sql.js"></script>
</body>
</html>
